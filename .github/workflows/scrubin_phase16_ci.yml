name: ScrubIn Phase 16 CI

on:
  push:
  pull_request:

jobs:
  phase16_validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # requirements.txt is the light set (API + engine + pytest deps). The
      # heavy vectorized stack lives in requirements-optional.txt and is
      # intentionally not installed here -- the gates and suite never import it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Setup environment
        run: |
          export PYTHONPATH=.

      # Gate 1 — Policy Fingerprint Integrity
      - name: Policy Fingerprint Gate
        run: PYTHONPATH=. python ci/gates/policy_fingerprint_gate.py

      # Gate 2 — System Lock Consistency
      - name: System Lock Gate
        run: PYTHONPATH=. python ci/gates/system_lock_gate.py

      # Gate 3 — Deterministic Replay Identity
      - name: Replay Determinism Gate
        run: PYTHONPATH=. python ci/gates/replay_determinism_gate.py

      # Gate 4 — Counterfactual Stability
      - name: Counterfactual Stability Gate
        run: PYTHONPATH=. python ci/gates/counterfactual_stability_gate.py

      # Gate 5 — External API Isolation
      - name: External API Safety Gate
        run: PYTHONPATH=. python ci/gates/api_isolation_gate.py

      # Gate 6 — Lint (ruff). Non-blocking: the codebase carries thousands of
      # pre-existing violations (this step never ran while the install was
      # broken) and no ruff config pins a rule set. Reported for signal only;
      # the pytest suite below is the hard gate.
      - name: Lint (ruff)
        run: ruff check scrubin tests
        continue-on-error: true

      # Gate 7 — Unit & integration tests
      - name: Pytest suite
        run: PYTHONPATH=. pytest -q --timeout=10 -o addopts=""

      # Gate 8 — Dependency vulnerability audit
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt
